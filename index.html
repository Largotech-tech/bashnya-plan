<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>План Башни Политех</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: сверху название и этажи, слева план (стены с плана эвакуации, помещения блоками), справа поиск и карточка помещения. */
:root {
  --bg:#eef1ec; --surface:#ffffff; --fg:#18201c; --muted:#5d6a63; --line:#d3d9d2;
  --floor:#f6f7f4; --wall:#27302b; --wall-soft:#7b8780; --void:#d5dbd4;
  --green:#cfe6bf; --green-s:#8fb974; --orange:#f8d9ad; --orange-s:#d9a35a; --blue:#bcdcf1; --blue-s:#6fa9cf;
  --purple:#e0d6f1; --purple-s:#a690cc; --red:#f6c3b7; --red-s:#dd6a4f; --grey:#e5e7e3; --grey-s:#a9b0aa;
  --accent:#da4927; --accent-fg:#ffffff; --brand:#37b34a; --brand-d:#23873a; --violet:#373062; --you:#2f62d6;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#111615; --surface:#1a2120; --fg:#eef2ef; --muted:#9aa69f; --line:#2f3937;
  --floor:#1f2726; --wall:#dfe7e2; --wall-soft:#7d8984; --void:#2c3634;
  --green:#34502a; --green-s:#6f9a57; --orange:#5e4422; --orange-s:#b9864a; --blue:#1f4a63; --blue-s:#5d9cc4;
  --purple:#3f3558; --purple-s:#8f7cb8; --red:#5c2b22; --red-s:#d4705a; --grey:#333b39; --grey-s:#6e7873;
  --accent:#f26a45; --accent-fg:#1b0d09; --brand:#4cc65f; --brand-d:#2f9a45; --violet:#a99bf0; --you:#7ea2ff; color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#111615; --surface:#1a2120; --fg:#eef2ef; --muted:#9aa69f; --line:#2f3937;
  --floor:#1f2726; --wall:#dfe7e2; --wall-soft:#7d8984; --void:#2c3634;
  --green:#34502a; --green-s:#6f9a57; --orange:#5e4422; --orange-s:#b9864a; --blue:#1f4a63; --blue-s:#5d9cc4;
  --purple:#3f3558; --purple-s:#8f7cb8; --red:#5c2b22; --red-s:#d4705a; --grey:#333b39; --grey-s:#6e7873;
  --accent:#f26a45; --accent-fg:#1b0d09; --brand:#4cc65f; --brand-d:#2f9a45; --violet:#a99bf0; --you:#7ea2ff; color-scheme:dark; }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--fg); font-family:var(--font); font-size:15px; line-height:1.45; margin:0; padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
.wrap { max-width:1000px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
body::before { content:""; position:fixed; inset:0 0 auto 0; height:6px; background:var(--brand); z-index:5; }
header { display:flex; flex-wrap:wrap; gap:14px 20px; align-items:center; justify-content:space-between; }
.lg { display:block; height:60px; width:auto; }
.dk { display:none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lt { display:none; } :root:not([data-theme="light"]) .dk { display:block; } }
:root[data-theme="dark"] .lt { display:none; } :root[data-theme="dark"] .dk { display:block; }
h1 { display:flex; align-items:center; gap:12px; font-size:30px; font-weight:800; letter-spacing:-.01em; text-transform:uppercase; margin:0; line-height:1.1; }
h1::before { content:""; flex:none; width:22px; height:22px; background:var(--brand); }
.seg { display:inline-flex; background:var(--surface); border:2px solid var(--fg); border-radius:6px; padding:0; gap:0; overflow:hidden; }
.seg button { font:700 15px var(--font); text-transform:uppercase; letter-spacing:.04em; color:var(--fg); background:transparent; border:0; border-radius:0; padding:11px 22px; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--brand-d); color:#fff; }
footer { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:10px; border-top:2px solid var(--fg); }
footer .lg { height:28px; }
.fnote { font-size:13px; color:var(--muted); margin:0; text-align:right; }
button:focus-visible, select:focus-visible, .rm:focus-visible { outline:3px solid var(--violet); outline-offset:2px; }
.main { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; align-items:start; }
.plan { background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--brand); border-radius:8px; padding:14px; }
.plan svg { display:block; width:100%; max-width:560px; height:auto; margin:0 auto; }
.side { display:flex; flex-direction:column; gap:12px; position:sticky; top:env(safe-area-inset-top,0px); }
.card { background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--brand); border-radius:8px; padding:16px; display:flex; flex-direction:column; gap:10px; }
.lbl { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
select { width:100%; font:500 16px var(--font); color:var(--fg); background:var(--floor); border:2px solid var(--fg); border-radius:6px; padding:11px 12px; }
.name { font-size:24px; font-weight:800; text-transform:uppercase; letter-spacing:0; margin:0; line-height:1.15; white-space:pre-line; }
.chip { display:inline-flex; align-items:center; gap:6px; align-self:flex-start; font-size:13px; font-weight:600; padding:4px 10px; border-radius:4px; background:var(--brand-d); color:#fff; border:0; }
.step { display:flex; gap:10px; align-items:flex-start; font-size:15px; margin:0; }
.step i { flex:none; width:22px; height:22px; border-radius:4px; background:var(--brand-d); color:#fff; font-style:normal; font-size:12px; font-weight:700; display:grid; place-items:center; margin-top:1px; }
.go { font:700 14px var(--font); text-transform:uppercase; letter-spacing:.03em; color:#fff; background:var(--brand-d); border:0; border-radius:6px; padding:9px 12px; cursor:pointer; align-self:flex-start; }
.muted { color:var(--muted); font-size:14px; margin:0; }
/* svg */
.rm { cursor:pointer; transition:opacity .2s; }
.rm rect.b { stroke-width:2; }
.rm.green rect.b{fill:var(--green);stroke:var(--green-s)} .rm.orange rect.b{fill:var(--orange);stroke:var(--orange-s)}
.rm.blue rect.b{fill:var(--blue);stroke:var(--blue-s)} .rm.purple rect.b{fill:var(--purple);stroke:var(--purple-s)} .rm.grey rect.b{fill:var(--grey);stroke:var(--grey-s)} .rm.red rect.b{fill:var(--red);stroke:var(--red-s)}
.rm:hover rect.b { stroke-width:6; }
.rm.sel rect.b { stroke:var(--accent); stroke-width:10; }
.dim .rm:not(.sel):not(.hint) { opacity:.35; }
.rm.hint rect.b { stroke:var(--accent); stroke-width:6; stroke-dasharray:18 10; }
.rm text { font-family:var(--font); font-weight:600; fill:var(--fg); text-anchor:middle; pointer-events:none; }
.mk rect { fill:var(--brand-d); }
g.wl line { stroke:var(--wall); stroke-width:10; stroke-linecap:square; }
g.wl line.door { stroke:var(--floor); stroke-width:4; stroke-linecap:round; opacity:0; }
g.wl line.door.on { stroke:var(--accent); stroke-width:9; opacity:1; } .mk text { font-family:var(--font); font-weight:700; fill:#fff; font-size:22px; letter-spacing:.04em; }
.mk.ex rect { fill:var(--surface); stroke:var(--wall-soft); stroke-width:2; } .mk.ex text { fill:var(--muted); font-weight:600; letter-spacing:0; }
@keyframes pulse { 0%{r:10;opacity:.6} 100%{r:34;opacity:0} }
.you .p { fill:var(--you); animation:pulse 1.8s ease-out infinite; }
@media (prefers-reduced-motion: reduce) { .you .p { animation:none; opacity:0; } .rm { transition:none; } }
@media (max-width:760px) { .main { grid-template-columns:minmax(0,1fr); } .side { position:static; order:-1; } .plan { padding:8px; border-radius:8px; } .lg{height:48px;} h1{font-size:24px;} }
.hdr-r { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.lang { display:inline-flex; border:2px solid var(--fg); border-radius:6px; overflow:hidden; }
.lang button { font:700 13px var(--font); letter-spacing:.04em; color:var(--fg); background:transparent; border:0; padding:11px 12px; cursor:pointer; }
.lang button[aria-pressed="true"] { background:var(--fg); color:var(--surface); }
.plan { position:relative; }
.plan svg { touch-action:pan-y; user-select:none; -webkit-user-select:none; }
.zoom { position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column; gap:6px; }
.zoom button { width:40px; height:40px; font:700 20px var(--font); color:var(--fg); background:var(--surface); border:2px solid var(--fg); border-radius:6px; cursor:pointer; line-height:1; }
.search { display:flex; flex-direction:column; gap:8px; }
.search input { width:100%; font:500 16px var(--font); color:var(--fg); background:var(--floor); border:2px solid var(--fg); border-radius:6px; padding:11px 12px; }
.quick { display:flex; flex-wrap:wrap; gap:6px; }
.quick button { font:600 14px var(--font); color:var(--fg); background:var(--floor); border:1px solid var(--line); border-radius:6px; padding:8px 11px; cursor:pointer; }
.quick button:hover { border-color:var(--brand-d); }
.res { list-style:none; margin:0; padding:0; max-height:230px; overflow:auto; border:1px solid var(--line); border-radius:6px; }
.res li { padding:9px 12px; font-size:15px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; border-top:1px solid var(--line); }
.res li:first-child { border-top:0; }
.res li:hover, .res li[aria-selected="true"] { background:var(--floor); }
.res li.gh { cursor:default; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); background:var(--floor); }
.res li span { color:var(--muted); font-size:13px; white-space:nowrap; }
.empty { padding:12px; color:var(--muted); font-size:14px; }
.cap { font-size:15px; margin:0; } .cap b { font-weight:700; }
.leg { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin:0; }
.leg svg { flex:none; }
.route { fill:none; stroke:var(--accent); stroke-width:9; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:22 16; animation:flow 1.2s linear infinite; }
.route-bg { fill:none; stroke:var(--surface); stroke-width:17; stroke-linecap:round; stroke-linejoin:round; opacity:.85; }
@keyframes flow { to { stroke-dashoffset:-38; } }
@media (prefers-reduced-motion: reduce) { .route { animation:none; } }
@media (max-width:760px) { .res { max-height:170px; } }
</style>
</head><body>

(function(){
